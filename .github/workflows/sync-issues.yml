name: Sync issues from intents
on:
  push:
    branches: [main]
    paths: ['docs/intent/**', 'docs/feature/**']
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/sync-issues.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
